services:
  dcsj:
    build: .
    ports:
      - "127.0.0.1:8767:8767"
    environment:
      DCSJ_DATA_DIR: /app/.runtime
    volumes:
      - designs:/app/.runtime
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=16m
volumes:
  designs:
