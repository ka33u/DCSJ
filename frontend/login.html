<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#12252b"><title>登录 · DCSJ 电磁设计</title><link rel="stylesheet" href="/auth.css"><script src="/login.js" defer></script></head>
<body class="login-page"><main class="login-card"><div class="login-brand">DCSJ <span>电磁设计工作台</span></div><p class="login-eyebrow">DESIGN WORKSPACE</p><h1>登录工作台</h1><p class="login-description">使用你的用户名登录。保存设计时，作者署名会自动填写为该用户名。</p>
<form id="login-form"><label for="username">用户名</label><input id="username" name="username" autocomplete="username" required maxlength="120" placeholder="请输入姓名或用户名" autofocus><label for="password">密码</label><input id="password" name="password" type="password" autocomplete="current-password" required maxlength="256" placeholder="请输入密码"><p class="login-help">初始密码为 1234。首次登录会自动建立账号。</p><p id="login-error" role="alert" hidden></p><button id="login-submit" type="submit">登录工作台 →</button></form><p class="login-footer">主设计 · 同心绕组 · 定转子槽型库</p></main></body></html>
