<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>定转子槽型库 · DCSJ</title><link rel="stylesheet" href="/slots.css"><link rel="stylesheet" href="/auth.css"><script src="/auth.js" defer></script><script src="/slot-picker.js" defer></script><script src="/slots.js" defer></script></head>
<body class="slot-page"><header><a href="/">DCSJ · 电磁设计</a><a href="/#workbench">主工作台</a><a href="/tx">同心绕组</a><strong>定转子槽型库</strong><div data-account aria-label="当前登录用户"></div></header>
<main><h1>定转子槽型库</h1><p class="lead">按名称、图号查找完整槽型。内置槽型与个人副本分别管理，作者由保存账户确定。计算结果按实际尺寸识别名称和图号。</p>
<div class="slot-layout"><aside class="slot-panel"><div class="slot-tabs" aria-label="槽型侧别"><button class="slot-button" data-side="stator" aria-pressed="true">定子槽</button><button class="slot-button" data-side="rotor" aria-pressed="false">转子槽</button></div>
<form id="slot-search" class="slot-tools"><input id="query" type="search" aria-label="搜索槽型" placeholder="槽型名称 / 图号" maxlength="120"><button class="slot-button">搜索</button></form>
<div class="slot-tools"><button id="new-slot" class="slot-button slot-primary">新增槽型</button><span id="count" class="slot-state" role="status"></span></div><div id="slot-list" class="slot-list"></div><div class="slot-tools"><button id="previous" class="slot-button">上一页</button><span id="page-label" class="slot-state"></span><button id="next" class="slot-button">下一页</button></div></aside>
<section class="slot-panel"><div id="empty">选择槽型查看尺寸，或新增完整槽型。</div><form id="slot-editor" hidden><h2 id="editor-title">槽型尺寸</h2>
<div class="slot-grid"><label class="slot-field wide">槽型名称<input id="slot-name" required maxlength="120"></label><label class="slot-field">图号<input id="drawing" maxlength="120"></label><label class="slot-field">尺寸单位<select id="module"><option value="main">主程序 · mm</option><option value="tx">TX · cm</option></select></label></div>
<div class="slot-grid"><label class="slot-field">作者（保存账户）<input id="slot-author" readonly></label></div><p id="save-help" class="slot-state"></p><p id="record-version" class="slot-version"></p><div id="aliases" class="slot-aliases" hidden></div><h2>槽型尺寸</h2><div id="dimension-fields" class="slot-grid"></div><h2>直径尺寸 · mm</h2><div id="geometry-fields" class="slot-grid"></div><p id="neck-help" class="slot-state" hidden>转子外径与 hr0 为成套尺寸。识别时比较 D2 − 2 × hr0，气隙变化且 hr0 同步变化时仍可识别为同一槽型。</p>
<div class="slot-tools"><button id="preview" type="button" class="slot-button">槽型示意</button></div><div id="slot-figure" class="slot-match-figure"></div>
<div class="slot-tools"><button id="save" class="slot-button slot-primary">保存槽型</button><button type="button" id="copy" class="slot-button">另存为</button><button type="button" id="versions" class="slot-button">版本记录</button><button type="button" id="archive" class="slot-button">归档</button></div><div id="history" class="slot-history"></div></form><p id="feedback" role="status" aria-live="polite"></p></section></div></main><dialog id="copy-dialog" class="slot-dialog"><form id="copy-form"><h2>另存为我的槽型</h2><p>创建独立记录，从第 1 版开始。原记录保留。</p><label class="slot-field">新槽型名称<input id="copy-name" required maxlength="120"></label><label class="slot-field">图号<input id="copy-drawing" maxlength="120"></label><label class="slot-field">作者（当前登录账户）<input id="copy-author" readonly></label><p id="copy-error" role="alert"></p><div class="slot-tools"><button id="copy-submit" class="slot-button slot-primary">创建我的副本</button><button id="copy-cancel" type="button" class="slot-button">取消</button></div></form></dialog></body></html>
